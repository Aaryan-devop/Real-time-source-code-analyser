<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodePulse Documentation</title>
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.0/github-markdown.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
        }
        .container {
            display: flex;
            height: 100vh;
        }
        .sidebar {
            width: 280px;
            background: #161b22;
            border-right: 1px solid #30363d;
            padding: 20px;
            overflow-y: auto;
        }
        .sidebar h2 {
            font-size: 16px;
            margin: 0 0 15px 0;
            color: #58a6ff;
        }
        .sidebar nav {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .sidebar button {
            background: none;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 10px 15px;
            text-align: left;
            cursor: pointer;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.2s;
        }
        .sidebar button:hover {
            background: #1f6feb;
            border-color: #1f6feb;
            color: white;
        }
        .sidebar button.active {
            background: #1f6feb;
            border-color: #1f6feb;
            color: white;
            font-weight: 600;
        }
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 40px;
        }
        .markdown-body {
            box-sizing: border-box;
            min-width: 200px;
            max-width: 980px;
            margin: 0 auto;
        }
        .markdown-body {
            background-color: #0d1117;
            color: #c9d1d9;
        }
        .markdown-body h1,
        .markdown-body h2,
        .markdown-body h3,
        .markdown-body h4,
        .markdown-body h5,
        .markdown-body h6 {
            color: #58a6ff;
            border-bottom-color: #21262d;
        }
        .markdown-body table tr {
            background-color: #0d1117;
            border-top-color: #21262d;
        }
        .markdown-body table tr:nth-child(2n) {
            background-color: #161b22;
        }
        .markdown-body table th,
        .markdown-body table td {
            border-color: #21262d;
        }
        .markdown-body code {
            background-color: rgba(110,118,129,0.4);
            color: #e6edf3;
        }
        .markdown-body pre {
            background-color: #161b22;
        }
        .markdown-body pre code {
            background-color: transparent;
        }
        .markdown-body a {
            color: #58a6ff;
        }
        .markdown-body blockquote {
            color: #8b949e;
            border-left-color: #3b434b;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #8b949e;
        }
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid #30363d;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h2>📚 CodePulse Docs</h2>
            <nav>
                <button onclick="loadDoc('ARCHITECTURE.md')" class="active">
                    🏗️ Architecture
                </button>
                <button onclick="loadDoc('MODULE_GUIDE.md')">
                    📦 Module Guide
                </button>
                <button onclick="loadDoc('FOLDER_STRUCTURE.md')">
                    📁 Folder Structure
                </button>
                <button onclick="loadDoc('DECISIONS.md')">
                    📋 Decisions (ADR)
                </button>
            </nav>
        </div>
        <div class="content">
            <article id="markdown-content" class="markdown-body">
                <div class="loading">Loading documentation...</div>
            </article>
        </div>
    </div>

    <script>
        marked.setOptions({
            breaks: true,
            gfm: true,
            headerIds: true,
        });

        async function loadDoc(filename) {
            const content = document.getElementById('markdown-content');
            content.innerHTML = '<div class="loading">Loading...</div>';

            // Update active button
            document.querySelectorAll('.sidebar button').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            try {
                const response = await fetch(filename);
                if (!response.ok) throw new Error('Failed to load document');

                const markdown = await response.text();
                const html = marked.parse(markdown);
                content.innerHTML = html;

                // Scroll to top
                document.querySelector('.content').scrollTop = 0;
            } catch (error) {
                content.innerHTML = `
                    <div class="markdown-body">
                        <h1>Error Loading Document</h1>
                        <p>Could not load ${filename}. Make sure the file exists in the docs/ folder.</p>
                        <pre>${error.message}</pre>
                    </div>
                `;
            }
        }

        // Load default document on page load
        window.addEventListener('DOMContentLoaded', () => {
            loadDoc('ARCHITECTURE.md');
        });
    </script>
</body>
</html>
